  <circle cx="44" cy="46" r="6" fill="#4b50e0"/>
  <rect x="58" y="41" width="120" height="9" rx="4.5" fill="#4b50e0" fill-opacity="0.55"/>
  <rect x="42" y="62" width="150" height="7" rx="3.5" class="mut"/>
  <rect x="42" y="74" width="120" height="7" rx="3.5" class="mut"/>
