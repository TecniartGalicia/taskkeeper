name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/vscode-extension

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json
      # The Go worker/ctl: build and test the whole module from the repo root.
      # Runs before `npm ci` so node_modules is not scanned.
      - name: Go build + test
        working-directory: .
        env:
          GOTOOLCHAIN: local
        run: |
          go build ./...
          go test ./...
      - name: npm ci
        run: npm ci
      - name: Typecheck + lint + unit tests + l10n
        env:
          GOTOOLCHAIN: local
        run: npm run check
      # Integration tests run only on Windows: that is the platform TaskKeeper
      # ships and the only one where the worker registers real scheduled tasks
      # (the Go worker has no Linux target, and task registration is a no-op there).
      - name: Integration tests (Windows only)
        if: runner.os == 'Windows'
        env:
          GOTOOLCHAIN: local
        run: npm run test:integration
      # Prove the win32-x64 VSIX packs from Linux with the cross-compiled worker.
      - name: Package win32-x64 (smoke)
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: local
        run: |
          rm -rf bin
          node scripts/build-bin.mjs win32-x64
          npx vsce package --no-dependencies --target win32-x64 -o taskkeeper-win32-x64.vsix
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: apps/vscode-extension/taskkeeper-win32-x64.vsix
