name: Release

# Tag vX.Y.Z (on a commit reachable from main) → check, build the win32-x64 worker,
# package, publish to VS Marketplace + Open VSX, attach the .vsix to a GitHub release.
# Re-running after a partial failure is safe: a version already published on a registry
# is detected and skipped.
# Required repository secrets: VSCE_PAT (Azure DevOps PAT, Marketplace › Manage), OVSX_PAT (open-vsx.org token).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/vscode-extension

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json
      - name: Verify tag is on main and matches package.json
        working-directory: .
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag commit is not on main"; exit 1; }
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./apps/vscode-extension/package.json').version")"
          test "$TAG" = "$PKG" || { echo "tag $TAG != package.json $PKG"; exit 1; }
      - name: Go test (the worker must be green before we ship it)
        working-directory: .
        env:
          GOTOOLCHAIN: local
        run: go test ./...
      - run: npm ci
      - name: Typecheck + lint + unit tests + l10n
        env:
          GOTOOLCHAIN: local
        run: npm run check
      - name: Build win32-x64 worker + package
        env:
          GOTOOLCHAIN: local
        run: |
          rm -rf bin
          node scripts/build-bin.mjs win32-x64
          npx vsce package --no-dependencies --target win32-x64 -o "taskkeeper-${GITHUB_REF_NAME}-win32-x64.vsix"
      - name: Publish to Visual Studio Marketplace (skips if this version is already there)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # `vsce show` prints "undefined" (not JSON) when the extension is not published yet: treat anything unparsable as "not there".
          if npx vsce show argalla.taskkeeper --json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{let j={};try{j=JSON.parse(d)||{}}catch{}process.exit((j.versions||[]).some(v=>v.version==='$VER')?0:1)})"; then
            echo "Marketplace already has $VER — skipping"
          else
            npx vsce publish --no-dependencies --packagePath "taskkeeper-${GITHUB_REF_NAME}-win32-x64.vsix"
          fi
      - name: Publish to Open VSX (skips if this version is already there)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if npx ovsx get argalla.taskkeeper -v "$VER" --metadata >/dev/null 2>&1; then
            echo "Open VSX already has $VER — skipping"
          else
            npx ovsx publish "taskkeeper-${GITHUB_REF_NAME}-win32-x64.vsix"   # reads OVSX_PAT from the env; never on argv
          fi
      - name: GitHub release with the VSIX attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "TaskKeeper $GITHUB_REF_NAME — see CHANGELOG.md. Windows x64 preview." \
            "taskkeeper-${GITHUB_REF_NAME}-win32-x64.vsix" || \
          gh release upload "$GITHUB_REF_NAME" "taskkeeper-${GITHUB_REF_NAME}-win32-x64.vsix" --clobber
