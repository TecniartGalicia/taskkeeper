name: Release

# Tag vX.Y.Z (on a commit reachable from main) → verify, then build/package/publish
# one VSIX per platform target, then a single GitHub release with all VSIXes attached.
#
# Structure (3 jobs): verify (once) → publish (matrix, one target per leg) → release (once).
# Re-running after a partial failure is safe: an "already exists / already published" for a
# given (version, target) is treated as success.
#
# Windows always ships. macOS (darwin-x64 / darwin-arm64) is built and code-signed with the
# Developer ID certificate (not notarized — the extension strips com.apple.quarantine from
# the helper binaries at install), but only PUBLISHED when the repository variable
# PUBLISH_MACOS is set to 'true' — flip it on after a real-Mac runtime check and a short beta.
#
# Required repository secrets:
#   VSCE_PAT, OVSX_PAT                              (Marketplace + Open VSX tokens)
#   APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD, APPLE_TEAM_ID   (Developer ID signing)
# The APPLE_API_* secrets are kept for a future notarization step but are currently unused.
# Optional repository variable:
#   PUBLISH_MACOS = 'true'                          (turns on macOS publishing)
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/vscode-extension

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json
      - name: Verify tag is on main and matches package.json
        working-directory: .
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag commit is not on main"; exit 1; }
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./apps/vscode-extension/package.json').version")"
          test "$TAG" = "$PKG" || { echo "tag $TAG != package.json $PKG"; exit 1; }
      - name: Go test (the worker must be green before we ship it)
        working-directory: .
        env:
          GOTOOLCHAIN: local
        run: go test ./...
      # macOS is cross-compiled here every release so a change can't break it silently.
      # The CI runner is Linux, so this is a compile-check, not a runtime test.
      - name: Compile-check the macOS worker
        working-directory: .
        env:
          GOOS: darwin
          GOTOOLCHAIN: local
        run: |
          GOARCH=arm64 go build ./...
          GOARCH=amd64 go build ./...
      - run: npm ci
      - name: Typecheck + lint + unit tests + l10n
        env:
          GOTOOLCHAIN: local
        run: npm run check

  publish:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64, os: ubuntu-latest }
          - { target: darwin-x64, os: macos-latest }
          - { target: darwin-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # A leg is ACTIVE when it is Windows, or when it is macOS and publishing is turned on.
    # Inactive legs skip every step (green no-op).
    env:
      ACTIVE: ${{ matrix.target == 'win32-x64' || vars.PUBLISH_MACOS == 'true' }}
      VSIX: taskkeeper-${{ github.ref_name }}-${{ matrix.target }}.vsix
    steps:
      - if: env.ACTIVE == 'true'
        uses: actions/checkout@v4
      - if: env.ACTIVE == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - if: env.ACTIVE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json
      - if: env.ACTIVE == 'true'
        run: npm ci
      - name: Build the ${{ matrix.target }} worker
        if: env.ACTIVE == 'true'
        env:
          GOTOOLCHAIN: local
        run: |
          rm -rf bin
          node scripts/build-bin.mjs ${{ matrix.target }}
      # --- macOS only: code-sign + notarize the binaries before they go into the VSIX ---
      - name: Import Developer ID certificate (macOS)
        if: env.ACTIVE == 'true' && startsWith(matrix.target, 'darwin')
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          printf '%s' "$P12_BASE64" | openssl base64 -d -A > cert.p12
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p actions "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p actions "$KC"
          security import cert.p12 -k "$KC" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -T /usr/bin/codesign
          # codesign searches the keychain SEARCH LIST, not just the default: add ours.
          security list-keychain -d user -s "$KC" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KC" >/dev/null
          security find-identity -v -p codesigning "$KC"
          rm -f cert.p12
      # Developer ID signature (not notarized): the extension strips
      # com.apple.quarantine from the helper binaries on macOS, so Gatekeeper does
      # not evaluate them; the signature still proves origin and integrity.
      # (Notarizing loose CLI binaries kept Apple's notary "In Progress" past the
      # job timeout, so it is intentionally left out for the preview.)
      - name: Sign the macOS binaries (Developer ID)
        if: env.ACTIVE == 'true' && startsWith(matrix.target, 'darwin')
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IDENTITY="Developer ID Application: Tecniart Galicia S.L. ($TEAM_ID)"
          for b in bin/${{ matrix.target }}/taskkeeper-worker bin/${{ matrix.target }}/taskkeeper-ctl; do
            codesign --force --timestamp --sign "$IDENTITY" "$b"
            codesign --verify --strict --verbose=2 "$b"
          done
      # --- package + publish this target ---
      - name: Package ${{ matrix.target }}
        if: env.ACTIVE == 'true'
        run: npx vsce package --no-dependencies --target ${{ matrix.target }} -o "$VSIX"
      - name: Publish to Visual Studio Marketplace
        if: env.ACTIVE == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          out="$(npx vsce publish --no-dependencies --packagePath "$VSIX" 2>&1)"; code=$?
          echo "$out"
          # Re-runs and indexing lag: an already-published (version,target) is success.
          if [ $code -ne 0 ] && ! echo "$out" | grep -qiE "already exists|already published"; then exit $code; fi
      - name: Publish to Open VSX
        if: env.ACTIVE == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          out="$(npx ovsx publish "$VSIX" --target ${{ matrix.target }} 2>&1)"; code=$?  # reads OVSX_PAT from env; never on argv
          echo "$out"
          if [ $code -ne 0 ] && ! echo "$out" | grep -qiE "already published|already exists"; then exit $code; fi
      - name: Upload the VSIX for the release job
        if: env.ACTIVE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: apps/vscode-extension/${{ env.VSIX }}
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: vsix-*
          merge-multiple: true
      - name: GitHub release with every VSIX attached
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "TaskKeeper $GITHUB_REF_NAME — see CHANGELOG.md." \
            dist/*.vsix \
          || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/*.vsix --clobber
